<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  :root {
    --ink: #2B2F36;
    --muted: #6B7280;
    --line: #DADDE2;
    --focus: #1F3A5F;
    --bg: #FFFFFF;
    --soft: #F6F7F9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex; flex-direction: column;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    font-size: 13px; line-height: 1.5; color: var(--ink); background: var(--bg);
  }

  /* 設定はスクロール、適用ボタンは常に下に表示 */
  main { flex: 1; overflow-y: auto; padding: 14px 14px 4px; }
  footer {
    flex: none; padding: 10px 14px 12px;
    border-top: 1px solid var(--line); background: var(--soft);
  }

  h2 { font-size: 12px; font-weight: 700; margin: 0 0 6px; }
  section { margin-bottom: 16px; }

  /* プリセット：3列のミニ表。見た目は Code.js の定義から作る */
  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .presets .loading { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .preset {
    display: flex; flex-direction: column; gap: 5px;
    width: 100%; padding: 6px; text-align: left; cursor: pointer;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    font: inherit; color: inherit;
  }
  .preset:hover { border-color: #AEB4BD; }
  .preset:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .preset[aria-pressed="true"] { border-color: var(--focus); box-shadow: inset 0 0 0 1px var(--focus); }
  .preset .label { font-size: 11px; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
  .preset[aria-pressed="true"] .label { font-weight: 700; }
  .mini { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .mini td { height: 8px; padding: 0; }

  /* 入力欄 */
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .field { margin-bottom: 10px; }
  .field > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  input[type="text"], input[type="number"], select {
    width: 100%; padding: 5px 8px; font: inherit; color: inherit;
    border: 1px solid var(--line); border-radius: 4px; background: var(--bg);
  }
  input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 12px; }

  /* 文字の設定は折りたたむ */
  details { border: 1px solid var(--line); border-radius: 6px; }
  summary {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 8px 10px; cursor: pointer; list-style: none;
    font-size: 12px; font-weight: 700;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "▸"; color: var(--muted); transition: transform .15s; }
  details[open] summary::after { transform: rotate(90deg); }
  summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  summary .current { flex: 1; font-weight: 400; color: var(--muted); font-size: 11px; text-align: right;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  details .body { padding: 2px 10px 4px; }

  /* フッター */
  .scope { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .scope label { flex: none; font-size: 12px; color: var(--muted); }
  button.apply {
    width: 100%; padding: 9px; cursor: pointer;
    background: var(--focus); color: #FFF; border: 0; border-radius: 4px;
    font: inherit; font-weight: 700;
  }
  button.apply:hover:not(:disabled) { background: #173050; }
  button.apply:disabled { opacity: .6; cursor: wait; }
  button.apply:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  #status { margin-top: 6px; font-size: 12px; min-height: 1.5em; color: var(--muted); }
  #status.done { color: #1E6B3A; }
  #status.error { color: #B42318; }
</style>
</head>
<body>
  <main>
    <section>
      <h2>デザイン</h2>
      <div class="presets" id="presets"><span class="loading">読み込み中…</span></div>
    </section>

    <section>
      <h2>揃え</h2>
      <div class="row field">
        <div>
          <label for="hAlign">横</label>
          <select id="hAlign">
            <option value="KEEP" selected>変更しない</option>
            <option value="START">左揃え</option>
            <option value="CENTER">中央揃え</option>
          </select>
        </div>
        <div>
          <label for="vAlign">縦</label>
          <select id="vAlign">
            <option value="KEEP" selected>変更しない</option>
            <option value="TOP">上揃え</option>
            <option value="MIDDLE">中央揃え</option>
          </select>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="alignNumbers" checked> 数値だけの列を右揃えにする</label>
    </section>

    <section>
      <details id="textSettings">
        <summary>文字の設定<span class="current" id="textSummary"></span></summary>
        <div class="body">
          <div class="field">
            <label for="fontFamily">フォント（空欄なら変更しない）</label>
            <input type="text" id="fontFamily" value="Noto Sans JP">
          </div>
          <div class="row field">
            <div>
              <label for="headerFontSize">見出し(pt)</label>
              <input type="number" id="headerFontSize" min="6" max="48" placeholder="変更しない">
            </div>
            <div>
              <label for="bodyFontSize">本文(pt)</label>
              <input type="number" id="bodyFontSize" min="6" max="48" placeholder="変更しない">
            </div>
          </div>
          <div class="field">
            <label for="boldColumns">太字にする列（例：1,4）</label>
            <input type="text" id="boldColumns" value="1">
          </div>
          <div class="field">
            <label class="check"><input type="checkbox" id="headerBold" checked> 見出し行を太字にする</label>
          </div>
        </div>
      </details>
    </section>
  </main>

  <footer>
    <div class="scope">
      <label for="scope">適用先</label>
      <select id="scope">
        <option value="selection" selected>選択中の表</option>
        <option value="slide">このスライドのすべての表</option>
        <option value="all">すべてのスライドの表</option>
      </select>
    </div>
    <button class="apply" id="apply" disabled>適用</button>
    <div id="status" role="status" aria-live="polite"></div>
  </footer>

<script>
  const MINI_ROWS = 4;
  const MINI_COLS = 4;
  const HINTS = {
    selection: '表の中をクリックしてから「適用」を押してください。',
    slide: '開いているスライドの表すべてに適用します。',
    all: 'プレゼンテーション内の表すべてに適用します。',
  };
  let selected = null;

  const $ = id => document.getElementById(id);
  const wrap = $('presets');
  const applyBtn = $('apply');
  const status = $('status');
  const scope = $('scope');

  google.script.run
    .withSuccessHandler(renderPresets)
    .withFailureHandler(err => {
      wrap.textContent = '';
      showStatus('プリセットを読み込めませんでした: ' + err.message, 'error');
    })
    .getPresets();

  function renderPresets(presets) {
    wrap.textContent = '';
    selected = presets[0].key;
    presets.forEach(p => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'preset';
      btn.title = p.name;
      btn.setAttribute('aria-pressed', p.key === selected);
      const label = document.createElement('span');
      label.className = 'label';
      // 「・」の後と「（」の前でだけ改行する
      p.name.split(/(?<=・)|(?=（)/).forEach((part, i) => {
        if (i > 0) label.appendChild(document.createElement('wbr'));
        label.appendChild(document.createTextNode(part));
      });
      btn.append(miniTable(p), label);
      btn.addEventListener('click', () => {
        selected = p.key;
        wrap.querySelectorAll('.preset').forEach(b => b.setAttribute('aria-pressed', 'false'));
        btn.setAttribute('aria-pressed', 'true');
      });
      wrap.appendChild(btn);
    });
    applyBtn.disabled = false;
  }

  // プリセットの定義から、4×4 のミニ表を描く
  function miniTable(p) {
    // 横線 h[i][c]（i = 0..行数）と縦線 v[r][j]（j = 0..列数）に、罫線を上から順に重ねる
    const h = grid(MINI_ROWS + 1, MINI_COLS);
    const v = grid(MINI_ROWS, MINI_COLS + 1);
    p.borders.forEach(b => {
      const r0 = 0;
      const r1 = b.range === 'header' ? 1 : MINI_ROWS;
      const css = b.color ? `${Math.max(1, Math.round(b.weight || 1))}px solid ${b.color}` : 'none';
      for (let i = r0; i <= r1; i++) {
        const outer = i === r0 || i === r1;
        if (lineMatches(b.position, 'h', outer, i === r0, i === r1)) h[i].fill(css);
      }
      for (let r = r0; r < r1; r++) {
        for (let j = 0; j <= MINI_COLS; j++) {
          const outer = j === 0 || j === MINI_COLS;
          if (lineMatches(b.position, 'v', outer, j === 0, j === MINI_COLS)) v[r][j] = css;
        }
      }
    });

    const table = document.createElement('table');
    table.className = 'mini';
    table.setAttribute('aria-hidden', 'true');
    for (let r = 0; r < MINI_ROWS; r++) {
      let fill = p.bodyFill;
      if (r === 0) fill = p.headerFill;
      else if (p.stripeFill && r % 2 === 0) fill = p.stripeFill;
      const tr = table.insertRow();
      for (let c = 0; c < MINI_COLS; c++) {
        const td = tr.insertCell();
        td.style.background = fill;
        td.style.borderTop = h[r][c];
        td.style.borderBottom = h[r + 1][c];
        td.style.borderLeft = v[r][c];
        td.style.borderRight = v[r][c + 1];
      }
    }
    return table;
  }

  // dir: 'h'（横線）/ 'v'（縦線）。first/last は範囲の上端・左端／下端・右端
  function lineMatches(position, dir, outer, first, last) {
    switch (position) {
      case 'ALL': return true;
      case 'OUTER': return outer;
      case 'INNER': return !outer;
      case 'INNER_HORIZONTAL': return dir === 'h' && !outer;
      case 'INNER_VERTICAL': return dir === 'v' && !outer;
      case 'TOP': return dir === 'h' && first;
      case 'BOTTOM': return dir === 'h' && last;
      case 'LEFT': return dir === 'v' && first;
      case 'RIGHT': return dir === 'v' && last;
      default: return false;
    }
  }

  function grid(rows, cols) {
    return Array.from({ length: rows }, () => Array(cols).fill('none'));
  }

  // 折りたたんだ「文字の設定」の見出しに、今の設定を短く表示する
  function updateTextSummary() {
    const parts = [];
    const font = $('fontFamily').value.trim();
    if (font) parts.push(font);
    const hs = $('headerFontSize').value, bs = $('bodyFontSize').value;
    if (hs || bs) parts.push(`${hs || '-'}/${bs || '-'}pt`);
    const cols = $('boldColumns').value.trim();
    if (cols) parts.push(`太字列 ${cols}`);
    $('textSummary').textContent = parts.join('・') || '変更しない';
  }
  ['fontFamily', 'headerFontSize', 'bodyFontSize', 'boldColumns']
    .forEach(id => $(id).addEventListener('input', updateTextSummary));
  updateTextSummary();

  function showStatus(text, kind) {
    status.className = kind || '';
    status.textContent = text;
  }
  function showHint() {
    showStatus(HINTS[scope.value]);
  }
  scope.addEventListener('change', showHint);
  showHint();

  applyBtn.addEventListener('click', () => {
    const opts = {
      scope: scope.value,
      hAlign: $('hAlign').value,
      vAlign: $('vAlign').value,
      alignNumbers: $('alignNumbers').checked,
      fontFamily: $('fontFamily').value.trim(),
      headerFontSize: $('headerFontSize').value,
      bodyFontSize: $('bodyFontSize').value,
      boldColumns: $('boldColumns').value,
      headerBold: $('headerBold').checked,
    };
    applyBtn.disabled = true;
    applyBtn.textContent = '適用中…';
    showStatus('');

    google.script.run
      .withSuccessHandler(msg => {
        showStatus(msg, 'done');
        reset();
      })
      .withFailureHandler(err => {
        showStatus(err.message, 'error');
        reset();
      })
      .applyPreset(selected, opts);
  });

  function reset() {
    applyBtn.disabled = false;
    applyBtn.textContent = '適用';
  }
</script>
</body>
</html>
